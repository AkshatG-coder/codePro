apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: app-ingress
  namespace: default
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/ssl-redirect: "false" # Set to "true" once SSL/TLS is enabled
    # cert-manager.io/cluster-issuer: letsencrypt-prod # Uncomment once cert-manager is installed
spec:
  # tls: # Uncomment and configure once cert-manager is installed and domain is set up
  #   - hosts:
  #       - codepro.yourdomain.com # Change to your actual domain
  #     secretName: codepro-tls
  rules:
    - http:
        paths:
          # Route all /api requests to Express API service
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: api
                port:
                  number: 4000
          # Route all other requests to Next.js web service
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web
                port:
                  number: 3000
