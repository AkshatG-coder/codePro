version: '3.8'

services:
  # ─── PostgreSQL Database ───────────────────────────────────────
  db:
    image: postgres:17-alpine
    container_name: codepro_db
    restart: always
    environment:
      POSTGRES_USER: codepro
      POSTGRES_PASSWORD: codepro_secret
      POSTGRES_DB: codepro
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U codepro"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ─── Redis Cache (Required by Judge0) ──────────────────────────
  redis:
    image: redis:7-alpine
    container_name: codepro_redis
    restart: always
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ─── Judge0 CE Server ─────────────────────────────────────────
  judge0-server:
    image: judge0/judge0:1.13.1
    container_name: codepro_judge0_server
    restart: always
    ports:
      - "2358:2358"
    volumes:
      - ./judge0.conf:/judge0.conf:ro
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    privileged: true
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["./scripts/server"]
    environment:
      - JUDGE0_TELEMETRY_ENABLE=false

  # ─── Judge0 CE Workers ────────────────────────────────────────
  judge0-workers:
    image: judge0/judge0:1.13.1
    container_name: codepro_judge0_workers
    restart: always
    volumes:
      - ./judge0.conf:/judge0.conf:ro
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    privileged: true
    depends_on:
      judge0-server:
        condition: service_started
    command: ["./scripts/workers"]
    environment:
      - JUDGE0_TELEMETRY_ENABLE=false

  # ─── Database Migration & Seeding ──────────────────────────────
  db-migrate:
    image: ghcr.io/akshatg-coder/codepro-api:latest
    container_name: codepro_db_migrate
    user: root
    environment:
      - DATABASE_URL=postgresql://codepro:codepro_secret@db:5432/codepro
    entrypoint: ""
    command: >
      sh -c "npx prisma db push --schema=packages/db/prisma/schema.prisma --accept-data-loss && npx tsx packages/db/src/seed/index.ts"
    depends_on:
      db:
        condition: service_healthy

  # ─── Express API Server ────────────────────────────────────────
  api:
    image: ghcr.io/akshatg-coder/codepro-api:latest
    container_name: codepro_api
    restart: always
    environment:
      - PORT=4000
      - NODE_ENV=production
      - DATABASE_URL=postgresql://codepro:codepro_secret@db:5432/codepro
      - JWT_SECRET=codepro_jwt_secret_replace_in_production_please
      - JUDGE0_API_URL=http://judge0-server:2358
      - FRONTEND_URL=https://codepro.akshatg.codes
    depends_on:
      db:
        condition: service_healthy
      db-migrate:
        condition: service_completed_successfully
      judge0-server:
        condition: service_started
    networks:
      - default
      - webnet


  # ─── Next.js Frontend ─────────────────────────────────────────
  web:
    image: ghcr.io/akshatg-coder/codepro-web:latest
    container_name: codepro_web
    restart: always
    environment:
      - PORT=3000
      - NODE_ENV=production
      - DATABASE_URL=postgresql://codepro:codepro_secret@db:5432/codepro
      - AUTH_URL=https://codepro.akshatg.codes
      - AUTH_SECRET=ReplaceThisWith32CharRandomStringRequiredByNextAuth
      - AUTH_TRUST_HOST=true
      - GOOGLE_CLIENT_ID=my-google-client-id
      - GOOGLE_CLIENT_SECRET=my-google-client-secret
      - NEXT_PUBLIC_APP_URL=https://codepro.akshatg.codes
      - JUDGE0_API_URL=http://judge0-server:2358
      - JUDGE0_CALLBACK_SECRET=secure-random-string-for-webhook
    ports:
      - "80:3000"
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
      db-migrate:
        condition: service_completed_successfully
      api:
        condition: service_started
    networks:
      - default
      - webnet

volumes:
  pgdata:

networks:
  webnet:
    external: true
