services:
  # ─── Next.js Frontend ──────────────────────────────────────────
  web:
    image: ghcr.io/akshatg-coder/codepro-web:latest
    container_name: codepro_web
    restart: always
    ports:
      - "127.0.0.1:3000:3000"
    env_file: .env
    environment:
      - NODE_ENV=production
      - JUDGE0_API_URL=http://judge0-server:2358
      - REDIS_URL=redis://redis:6379
    depends_on:
      judge0-server:
        condition: service_started
    networks:
      - default
      - webnet



  # ─── PostgreSQL Database (Judge0 internal only) ────────────────
  db:
    image: postgres:17-alpine
    container_name: codepro_db
    restart: always
    environment:
      POSTGRES_USER: codepro
      POSTGRES_PASSWORD: codepro_secret
      POSTGRES_DB: codepro
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U codepro"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ─── Redis Cache (Required by Judge0) ──────────────────────────
  redis:
    image: redis:7-alpine
    container_name: codepro_redis
    restart: always
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ─── Judge0 CE Server (Custom image with baked-in config) ──────
  judge0-server:
    image: ghcr.io/akshatg-coder/codepro-judge0:latest
    container_name: codepro_judge0_server
    restart: always
    volumes:
      - ./judge0.conf:/judge0.conf:ro
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    privileged: true
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["./scripts/server"]
    environment:
      - JUDGE0_TELEMETRY_ENABLE=false

  # ─── Judge0 CE Workers ────────────────────────────────────────
  judge0-workers:
    image: ghcr.io/akshatg-coder/codepro-judge0:latest
    container_name: codepro_judge0_workers
    restart: always
    volumes:
      - ./judge0.conf:/judge0.conf:ro
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    privileged: true
    depends_on:
      judge0-server:
        condition: service_started
    command: ["./scripts/workers"]
    environment:
      - JUDGE0_TELEMETRY_ENABLE=false

  # ─── Auto-Cleanup: Wipes Judge0 junk data every 6 hours ───────
  db-cleanup:
    image: postgres:17-alpine
    container_name: codepro_db_cleanup
    restart: always
    depends_on:
      db:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        echo "🧹 Judge0 DB cleanup sidecar started (every 6 hours)"
        while true; do
          sleep 21600
          echo "$$(date) – Truncating Judge0 submissions..."
          PGPASSWORD=codepro_secret psql -h db -U codepro -d judge0 -c "TRUNCATE TABLE submissions CASCADE;" 2>/dev/null || echo "  ⚠ judge0 DB not ready yet, skipping"
          echo "$$(date) – Cleanup complete"
        done

volumes:
  pgdata:

networks:
  webnet:
    external: true
