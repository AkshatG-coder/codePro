version: '3.8'

services:
  # ─── PostgreSQL Database ───────────────────────────────────────
  db:
    image: postgres:17-alpine
    container_name: codepro_db
    restart: always
    environment:
      POSTGRES_USER: codepro
      POSTGRES_PASSWORD: codepro_secret
      POSTGRES_DB: codepro
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U codepro"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ─── Redis Cache (Required by Judge0) ──────────────────────────
  redis:
    image: redis:7-alpine
    container_name: codepro_redis
    restart: always
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ─── Judge0 CE Server ─────────────────────────────────────────
  judge0-server:
    image: judge0/judge0:1.13.1
    container_name: codepro_judge0_server
    restart: always
    ports:
      - "2358:2358"
    volumes:
      - ./judge0.conf:/judge0.conf:ro
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    privileged: true
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["./scripts/server"]
    environment:
      - JUDGE0_TELEMETRY_ENABLE=false

  # ─── Judge0 CE Workers ────────────────────────────────────────
  judge0-workers:
    image: judge0/judge0:1.13.1
    container_name: codepro_judge0_workers
    restart: always
    volumes:
      - ./judge0.conf:/judge0.conf:ro
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    privileged: true
    depends_on:
      judge0-server:
        condition: service_started
    command: ["./scripts/workers"]
    environment:
      - JUDGE0_TELEMETRY_ENABLE=false


volumes:
  pgdata:

networks:
  webnet:
    external: true
